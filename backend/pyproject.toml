[project]
name = "pdf-stream-backend"
version = "0.1.0"
description = "Secure PDF streaming backend with Flask"
authors = [
    {name = "Priti Jadhav", email = "pvjadhav2513@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "boto3 (>=1.42.51,<2.0.0)",
    "pymongo (>=4.12,<5.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)",
    "flask-jwt-extended (>=4.7.1,<5.0.0)",
    "flask-mail (>=0.10.0,<0.11.0)",
    "requests (>=2.32.0,<3.0.0)",
    "pypdf (>=5.4.0,<6.0.0)",
    "langchain (>=0.3.0,<0.4.0)",
    "langchain-core (>=0.3.0,<0.4.0)",
    "langchain-groq",
    "langchain-text-splitters",
    "langchain-mongodb",

    "langgraph (<0.3.0)",
    "langgraph-checkpoint-mongodb (<0.3.0)",
    "gunicorn (>=25.3.0,<26.0.0)",
    "gevent (>=26.4.0,<27.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

