[project]
name = "pdf-stream-backend"
version = "2.0.0"
description = "Secure PDF streaming backend with FastAPI"
authors = [
    {name = "Priti Jadhav", email = "pvjadhav2513@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "boto3>=1.42.51,<2.0.0",
    "pymongo>=4.12,<5.0.0",
    "dnspython>=2.6.0,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "pypdf>=5.4.0,<6.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-groq>=0.2.0,<1.0.0",
    "langchain-text-splitters>=0.3.0,<1.0.0",
    "fastembed>=0.8.0,<0.9.0",
    "aiosmtplib>=3.0.0,<4.0.0",
    "emails>=0.6.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
