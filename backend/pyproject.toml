# REMOVE it from here
authors = [
    {name = "Priti Jadhav", email = "pvjadhav2513@gmail.com"}
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "boto3 (>=1.42.51,<2.0.0)",
    "pymongo (>=4.16.0,<5.0.0)",
